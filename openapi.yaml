openapi: 3.1.0
info:
  title: Downloader Server API
  version: 0.3.1
  description: |-
    # Downloader Server API

    Use the standalone server to queue and monitor media downloads, inspect
    downloader engines, save presets and URL routing rules, and configure local
    or WebDAV file delivery. API operations use the /api/v1 base path.

    ## Authentication

    Every /api/v1 request requires the administrator API key in the
    `X-API-Key` HTTP header, for example `X-API-Key: YOUR_API_KEY`.
    This key grants full access. Keep it in trusted server-side integrations,
    never in public browser code or URL parameters.

    The informational `/healthz`, `/openapi.yaml` and `/api-reference`
    routes are public exceptions and do not require an API key.

    ## Getting started

    Start with `POST /jobs` to enqueue a job, `GET /jobs` to track progress,
    and `GET /jobs/{job_id}` to view status and delivered files. The sections
    below cover download engines, saved settings, and delivery destinations.
tags:
  - name: jobs
    description: Submit links, inspect progress, cancel or retry, and verify deliveries.
  - name: engines
    description: Inspect installed downloader engines and configure their options.
  - name: settings
    description: Manage saved engine presets and URL routing.
  - name: delivery
    description: Choose local storage or WebDAV delivery.
servers:
  - url: /api/v1
security:
  - ApiKeyAuth: []
paths:
  /preview:
    post:
      operationId: previewYtDlpMedia
      summary: Inspect yt-dlp media formats or page source-ordered playlist entries without downloading
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, minLength: 8, maxLength: 4096 }
                max_entries: { type: integer, minimum: 1, maximum: 100, default: 50 }
                offset: { type: integer, minimum: 0, maximum: 100000, default: 0, description: Zero-based playlist offset }
            example: {url: 'https://example.org/video', max_entries: 20, offset: 0}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: |-
            Sanitized yt-dlp metadata. Entries retain extractor source order (which
            is newest-first when the source's own order is newest-first); Core
            does not globally sort by timestamp. Missing thumbnails, duration,
            timestamps and live fields are null, not generated placeholders.
            has_more and next_offset support subsequent bounded pages. Flat
            playlists can omit metadata even when a detail extractor has it.
          content:
            application/json:
              example:
                title: Example clip
                id: example-clip
                extractor: Generic
                kind: video
                entry_count: 0
                thumbnail: null
                duration: null
                timestamp: null
                release_timestamp: null
                upload_date: null
                live_status: null
                is_live: null
                offset: 0
                max_entries: 20
                ordering: source
                has_more: false
                next_offset: null
                entries: []
                formats:
                  - {format_id: '720p', ext: mp4, resolution: 1280x720, vcodec: h264, acodec: aac, filesize: null}
                subtitle_languages: []
        '422': { description: Invalid or unsupported URL, or preview failed }
  /torrent/manifest:
    post:
      operationId: inspectTorrentManifest
      summary: List files in magnet metadata or uploaded .torrent bytes without downloading payloads
      description: |-
        Metadata-only read; never queues a regular job. Pass either a magnet
        URI as url or base64-encoded .torrent bytes (maximum 2 MB) as
        torrent_base64. Remote HTTP .torrent URLs are not accepted because
        this endpoint cannot guarantee a non-torrent response is metadata.
        A metadata fetch can time out if peers do not supply a magnet manifest.
        Paths are relative to an isolated temporary inspection directory.
        The aria2 preview transfer and any follow-on metadata GIDs are removed
        after the response; downstream file selection is a separate operation.
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of the two nullable fields must be non-null.
              properties:
                url: { type: [string, 'null'], minLength: 8, maxLength: 4096, description: Magnet URI }
                torrent_base64: { type: [string, 'null'], minLength: 4, maxLength: 2800000, description: Base64 .torrent file }
            example: {url: 'magnet:?xt=urn:btih:0123456789012345678901234567890123456789'}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Actual torrent file indices, relative paths and sizes
          content:
            application/json:
              schema:
                type: object
                required: [file_count, files]
                properties:
                  file_count: { type: integer, minimum: 0 }
                  files:
                    type: array
                    items:
                      type: object
                      required: [index, path, name, size_bytes]
                      properties:
                        index: { type: integer, minimum: 1 }
                        path: { type: string }
                        name: { type: string }
                        size_bytes: { type: integer, minimum: 0 }
              example:
                file_count: 1
                files:
                  - {index: 1, path: 'album/cover.jpg', name: cover.jpg, size_bytes: 123}
        '422': { description: Invalid manifest source or metadata fetch failed }
  /engines:
    get:
      operationId: listEngines
      summary: List available download engines and their defaults
      tags: [engines]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Engine capabilities and default settings
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EngineStatusOut' } }
              example:
                - name: yt-dlp
                  label: yt-dlp
                  role: primary
                  priority: P0
                  available: true
                  installed: true
                  version: '2026.01.01'
                  defaults: {}
  /engines/{engine_name}/policy:
    parameters:
      - name: engine_name
        in: path
        required: true
        schema: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce, telegram, pyload, musicdl, ddddocr] }
    get:
      operationId: getEnginePolicy
      summary: Read per-engine enablement, requirement readiness and RAM opt-in
      tags: [engines]
      responses:
        '200':
          description: Persisted engine policy with unmet requirements
          content:
            application/json:
              example:
                engine: ddddocr
                enabled: true
                run_carefully: false
                requires_run_carefully: true
                ram_note: Uses 150–350 MB RAM while solving
                requirements_met: false
                permitted: false
                inactive_reason: Explicit run carefully opt-in is required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown engine }
    put:
      operationId: updateEnginePolicy
      summary: Persist enablement and explicit background engine opt-in
      tags: [engines]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnginePolicyIn' }
            example: {enabled: true, run_carefully: true}
      responses:
        '200':
          description: Saved effective policy
          content:
            application/json:
              example: {engine: ddddocr, enabled: true, run_carefully: true, requires_run_carefully: true, requirements_met: true, permitted: true}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown engine }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /engines/telegram/credentials:
    get:
      operationId: getTelegramCredentialStatus
      summary: Check Telegram credential readiness without revealing secrets
      tags: [engines]
      responses:
        '200':
          description: Redacted Telegram credential readiness
          content:
            application/json:
              example: {configured: false, secrets_returned: false}
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateTelegramCredentials
      summary: Store owner-provided Telegram API credentials and an authorized MTProto session encrypted
      description: Requires APP_ENCRYPTION_KEY. Never returns plaintext API hash or session data.
      tags: [engines]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramCredentialsIn' }
            example:
              api_id: 123456
              api_hash: '0123456789abcdef0123456789abcdef'
              session_string: 'PASTE_YOUR_OWN_AUTHORIZED_TELEGRAM_SESSION_STRING'
      responses:
        '200':
          description: Redacted credential readiness
          content:
            application/json:
              example: {configured: true, secrets_returned: false}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /engines/{engine_name}/options:
    parameters:
      - name: engine_name
        in: path
        required: true
        schema: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce, telegram, pyload, musicdl, ddddocr] }
    get:
      operationId: getEngineOptionCatalog
      summary: List typed common engine option fields for graphical settings
      tags: [engines]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Categorized option fields with types and labels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineOptionsOut' }
        '404': { description: Unknown engine }
  /engines/{engine_name}/settings:
    parameters:
      - name: engine_name
        in: path
        required: true
        schema: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce, telegram, pyload, musicdl, ddddocr] }
    get:
      operationId: getEngineSettings
      summary: Read global settings for one engine
      tags: [engines]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Engine settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineSettingsOut' }
              example: {engine: yt-dlp, settings: {format: 'best[height<=720]/best'}}
    put:
      operationId: updateEngineSettings
      summary: Update global settings for one engine
      tags: [engines]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EngineSettingsInput' }
            example:
              settings: {format: 'best[height<=720]/best', write_subtitles: false}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Saved engine settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineSettingsOut' }
              example: {engine: yt-dlp, settings: {format: 'best[height<=720]/best', write_subtitles: false}}
        '422': { description: Invalid setting }
  /cookies:
    get:
      operationId: listCookieFiles
      summary: List uploaded cookie file names and sizes without reading their contents
      tags: [engines]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Cookie file inventory
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CookieFileOut' } }
  /cookies/{filename}:
    parameters:
      - name: filename
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: uploadCookieFile
      summary: Store a Netscape-format cookie export in the private service data volume
      tags: [engines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_base64]
              properties:
                content_base64: { type: string, minLength: 4, maxLength: 1400000 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Stored cookie file; content is never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CookieUploadedOut' }
        '422': { description: Invalid filename or file content }
    delete:
      operationId: deleteCookieFile
      summary: Delete an uploaded cookie file
      tags: [engines]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Cookie file deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CookieDeletedOut' }
        '404': { description: Cookie file not found }
  /presets:
    get:
      operationId: listPresets
      summary: List saved per-engine option presets
      tags: [settings]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: Saved presets }
    post:
      operationId: createPreset
      summary: Create a named engine options preset
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetInput' }
            example:
              name: Video at 720p
              engine: yt-dlp
              description: Save bandwidth
              settings: {format: 'best[height<=720]/best'}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '201':
          description: Preset created
          content:
            application/json:
              example:
                id: 11111111-1111-4111-8111-111111111111
                name: Video at 720p
                engine: yt-dlp
                description: Save bandwidth
                settings: {format: 'best[height<=720]/best'}
                is_shared: false
                created_at: '2026-11-01T12:00:00Z'
                updated_at: '2026-11-01T12:00:00Z'
        '409': { description: Preset name already exists for the engine }
  /presets/shared:
    get:
      operationId: listSharedPresets
      summary: List only administrator-approved presets available to entitled Nextcloud users
      description: >-
        Requires the core administrator token. Never includes private Core presets
        or personal Nextcloud user presets. Shared settings cannot contain
        another user's cookies, proxy or custom CLI arguments.
      tags: [settings]
      responses:
        '200': { description: Presets explicitly marked available to everyone }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /presets/{preset_id}:
    parameters:
      - name: preset_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updatePreset
      summary: Replace a saved preset
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '200': { description: Preset updated }
        '404': { description: Preset not found }
    delete:
      operationId: deletePreset
      summary: Delete a saved preset
      tags: [settings]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: Preset deleted }
        '404': { description: Preset not found }
  /engine-rules:
    get:
      operationId: listEngineRules
      summary: List URL host/path rules used by automatic engine selection
      tags: [settings]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: URL engine rules, ordered by priority and specificity }
    post:
      operationId: createEngineRule
      summary: Create a host suffix and path prefix engine rule
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EngineRuleInput' }
            example: {host_suffix: example.org, path_prefix: /media, engine: yt-dlp, priority: 100, enabled: true}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201':
          description: Rule created
          content:
            application/json:
              example:
                id: 22222222-2222-4222-8222-222222222222
                host_suffix: example.org
                path_prefix: /media
                engine: yt-dlp
                priority: 100
                enabled: true
                description: Videos from example.org
                created_at: '2026-11-01T12:00:00Z'
                updated_at: '2026-11-01T12:00:00Z'
        '422': { description: Invalid host or path rule }
  /engine-rules/order:
    put:
      operationId: reorderEngineRules
      summary: Save the complete drag-and-drop order of routing rules atomically
      description: >-
        The ordered IDs must be a complete snapshot of every current rule,
        including disabled rules. Priorities are reassigned 1000, 999, ...
        in the supplied order. Missing or unknown IDs reject the whole transaction;
        reload if another administrator changed the routing table.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EngineRuleOrderInput' }
            example:
              ids:
                - 11111111-1111-4111-8111-111111111111
                - 22222222-2222-4222-8222-222222222222
      responses:
        '200':
          description: All routing rules in the saved order and their updated numeric priorities
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EngineRuleOut' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Stale or incomplete routing-rule snapshot }
        '422': { description: Invalid or duplicate IDs, or more than 1001 rules }
  /engine-rules/{rule_id}:
    parameters:
      - name: rule_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateEngineRule
      summary: Replace a URL engine rule
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EngineRuleInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '200': { description: Rule updated }
        '404': { description: Rule not found }
    delete:
      operationId: deleteEngineRule
      summary: Delete a URL engine rule
      tags: [settings]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: Rule deleted }
        '404': { description: Rule not found }
  /provenance:
    get:
      operationId: getFileProvenance
      summary: Resolve a downloaded Nextcloud file's source for its owner
      tags: [jobs]
      parameters:
        - name: owner_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: file_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: File provenance not found for this owner }
        '422': { description: Invalid file identity }
        '200':
          description: Download source bound to the owner and stable Nextcloud file ID
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /jobs:
    get:
      operationId: listJobs
      summary: List recent jobs
      tags: [jobs]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: status
          in: query
          schema: { type: string }
        - name: state
          in: query
          description: Friendly Library state filter, independent of exact status
          schema: { type: string, enum: [all, active, delivered, failed], default: all }
        - name: q
          in: query
          description: Search URL and delivered filenames (maximum 128 characters)
          schema: { type: [string, 'null'], maxLength: 128 }
        - name: offset
          in: query
          description: Zero-based pagination offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - name: standalone_only
          in: query
          description: Exclude Nextcloud-owned jobs from the standalone Library
          schema: { type: boolean, default: false }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Recent jobs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/JobOut' } }
              example: []
    post:
      operationId: submitJob
      summary: Submit a download job
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreate' }
            examples:
              simplest:
                summary: Download a public link with automatic engine selection
                value: {url: 'https://example.org/sample.mp4', engine: auto}
              quality:
                summary: Request yt-dlp quality
                value: {url: 'https://example.org/video', engine: yt-dlp, overrides: {format: 'best[height<=720]/best'}}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: Job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOut' }
              example:
                id: 11111111-1111-4111-8111-111111111111
                url: https://example.org/sample.mp4
                owner_id: null
                delivery_subfolder: null
                engine: yt-dlp
                status: queued
                overrides: {}
                progress: {}
                output_files: []
                log_text: ''
                error: null
                cancel_requested: false
                created_at: '2026-01-01T12:00:00Z'
                updated_at: '2026-01-01T12:00:00Z'
                finished_at: null
        '422': { description: Invalid URL or options }
  /jobs/batch:
    post:
      operationId: submitBatch
      summary: Atomically queue up to 50 download jobs
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobBatchCreate' }
            example:
              items:
                - {url: 'https://example.org/one.mp4', engine: auto}
                - {url: 'https://example.org/two.mp4', engine: auto}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: All batch items queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobBatchOut' }
              example:
                created: 1
                jobs:
                  - id: 11111111-1111-4111-8111-111111111111
                    url: https://example.org/one.mp4
                    owner_id: null
                    delivery_subfolder: null
                    engine: yt-dlp
                    status: queued
                    overrides: {}
                    progress: {}
                    output_files: []
                    log_text: ''
                    error: null
                    cancel_requested: false
                    created_at: '2026-11-01T12:00:00Z'
                    updated_at: '2026-11-01T12:00:00Z'
                    finished_at: null
        '422': { description: Invalid batch item; no items are queued }
  /jobs/retry-failed:
    post:
      operationId: retryFailedStandaloneJobs
      summary: Retry failed and cancelled standalone downloads
      description: >-
        Queues up to 1000 failed or cancelled jobs without an owner ID. Never
        retries Nextcloud user-owned jobs; does not modify already active jobs.
      tags: [jobs]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Number of standalone jobs requeued
          content:
            application/json:
              schema:
                type: object
                required: [retried]
                properties: { retried: { type: integer, minimum: 0 } }
              example: { retried: 3 }
        '422': { description: Too many failed jobs for one operation }
  /jobs/history:
    delete:
      operationId: clearStandaloneJobHistory
      summary: Clear only completed/failed/cancelled standalone job history
      description: >-
        Requires explicit confirm=true and never deletes downloaded local or
        Nextcloud Files. Cannot affect running jobs or per-user provenance.
        Re-delivery of forgotten jobs will no longer be available.
      tags: [jobs]
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: boolean, enum: [true] }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Number of forgotten standalone records; files are retained
          content:
            application/json:
              schema:
                type: object
                required: [deleted, files_retained]
                properties: { deleted: { type: integer, minimum: 0 }, files_retained: { type: boolean } }
              example: { deleted: 12, files_retained: true }
        '422': { description: Explicit confirmation required }
  /jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getJob
      summary: Read job state, progress, logs, and delivered files
      tags: [jobs]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Job details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOut' }
              example:
                id: 11111111-1111-4111-8111-111111111111
                url: https://example.org/sample.mp4
                owner_id: null
                delivery_subfolder: null
                engine: yt-dlp
                status: completed
                overrides: {}
                progress: {percent: 100}
                output_files: [{filename: sample.mp4, size_bytes: 1024}]
                log_text: ''
                error: null
                cancel_requested: false
                created_at: '2026-11-01T12:00:00Z'
                updated_at: '2026-11-01T12:01:00Z'
                finished_at: '2026-11-01T12:01:00Z'
        '404': { description: Job not found }
  /jobs/{job_id}/cancel:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelJob
      summary: Request cancellation of a queued or running job
      tags: [jobs]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Cancellation requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOut' }
        '409': { description: Job cannot be cancelled in its current state }
  /jobs/{job_id}/captcha:
    post:
      operationId: answerManualCaptcha
      summary: Submit a manual pyLoad captcha answer and resume the original package
      description: Only captcha-waiting pyLoad jobs may accept an answer, which is never stored in the job log.
      tags: [jobs]
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptchaAnswerIn' }
            example: {answer: ABCD}
      responses:
        '200':
          description: The existing pyLoad package is queued to resume
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOut' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Job not found }
        '409': { description: Job has no resumable pyLoad captcha challenge }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '502': { description: pyLoad rejected captcha submission }
        '503': { description: pyLoad service not configured }
  /jobs/{job_id}/pause:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: pauseJob
      summary: Pause a live transfer when that job reports can_pause
      tags: [jobs]
      responses:
        '200': { description: Same job paused, content: { application/json: { schema: { $ref: '#/components/schemas/JobOut' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Job not found }
        '409': { description: Per-job engine or current state cannot pause without restarting }
  /jobs/{job_id}/resume:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: resumeJob
      summary: Resume the same paused aria2 transfer without a new job
      tags: [jobs]
      responses:
        '200': { description: Same job resumed, content: { application/json: { schema: { $ref: '#/components/schemas/JobOut' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Job not found }
        '409': { description: No resumable transfer for this job }
  /jobs/{job_id}/retry:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: retryJob
      summary: Queue a failed or cancelled job again
      tags: [jobs]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: Job queued for retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOut' }
        '409': { description: Job is not retryable }
  /jobs/{job_id}/redeliver:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: redeliverJob
      summary: Re-deliver completed and still-verified files to the current destination without downloading again
      tags: [jobs]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: Verified original output files queued for re-delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOut' }
        '404': { description: Job not found }
        '409': { description: Job is not completed or verified source files are unavailable }
  /jobs/{job_id}/events:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: streamJobEvents
      summary: Stream job updates using Server-Sent Events
      tags: [jobs]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Job updates as SSE events
          content:
            text/event-stream:
              schema: { type: string }
  /delivery:
    get:
      operationId: getDeliverySettings
      summary: Read delivery destination settings without revealing secrets
      tags: [delivery]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Delivery mode and masked credentials state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliverySettingsOut' }
              example: {mode: webdav, folder: Downloads, password_configured: true, webdav_url: 'https://cloud.example.org/remote.php/dav/files/example', username: example}
    put:
      operationId: updateDeliverySettings
      summary: Configure local or WebDAV delivery
      tags: [delivery]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliverySettingsInput' }
            examples:
              local:
                summary: Store finished files on the downloader server
                value: {mode: local, folder: Downloader}
              webdav:
                summary: Send delivered files to Nextcloud WebDAV
                value: {mode: webdav, webdav_url: 'https://cloud.example.org/remote.php/dav/files/example', username: example, folder: Downloads}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Saved delivery settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliverySettingsOut' }
              example: {mode: webdav, folder: Downloads, password_configured: true, webdav_url: 'https://cloud.example.org/remote.php/dav/files/example', username: example}
        '422': { description: Invalid delivery settings }
  /delivery/test:
    post:
      operationId: testDeliveryDestination
      summary: Verify the configured destination by uploading and removing a small temporary test file
      description: >-
        Requires the administrator API token. Local mode writes, reads and removes
        a temporary file in the local output folder. WebDAV mode creates the
        configured folder when missing, then uploads, verifies size and exact
        bytes by readback, and deletes a unique test file. A failed cleanup
        must be treated as failed verification. No credentials are returned.
      tags: [delivery]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Destination verified and temporary file removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTestOut' }
              example:
                mode: webdav
                verified: true
                cleaned_up: true
                message: WebDAV test upload, readback and cleanup all succeeded
        '422': { description: Destination not configured, unreachable, unverified or cleanup failed }
components:
  responses:
    Unauthorized:
      description: Missing or invalid X-API-Key header
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail: { type: string }
    InvalidRequest:
      description: Invalid request body or service-specific validation error
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail:
                anyOf:
                  - { type: string }
                  - { type: array, items: { type: object } }
                  - { type: object }
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    EngineStatusOut:
      type: object
      required: [name, label, role, priority, available, installed, version, defaults]
      properties:
        name: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce, telegram, pyload, musicdl, ddddocr] }
        label: { type: string }
        role: { type: string }
        priority: { type: string }
        available: { type: boolean }
        installed: { type: boolean }
        version: { type: [string, 'null'] }
        defaults: { type: object, additionalProperties: true }
        enabled: { type: boolean, default: true }
        run_carefully: { type: boolean, default: false }
        requires_run_carefully: { type: boolean, default: false }
        ram_note: { type: [string, 'null'], default: null }
        requirements_met: { type: boolean, default: true }
        inactive_reason: { type: [string, 'null'], default: null }
    EnginePolicyIn:
      type: object
      required: [enabled, run_carefully]
      properties:
        enabled: { type: boolean }
        run_carefully: { type: boolean }
    TelegramCredentialsIn:
      type: object
      required: [api_id, api_hash, session_string]
      properties:
        api_id: { type: integer, exclusiveMinimum: 0 }
        api_hash:
          type: string
          minLength: 32
          maxLength: 32
          pattern: '^[a-fA-F0-9]{32}$'
        session_string: { type: string, minLength: 64, maxLength: 4096 }
    CaptchaAnswerIn:
      type: object
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 1024 }
    EngineOptionFieldOut:
      type: object
      required: [key, label, category, type, description]
      properties:
        key: { type: string }
        label: { type: string }
        category: { type: string }
        type: { type: string }
        description: { type: string }
        minimum: { type: [integer, 'null'], default: null }
        maximum: { type: [integer, 'null'], default: null }
    EngineOptionsOut:
      type: object
      required: [engine, fields]
      properties:
        engine: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce, telegram, pyload, musicdl, ddddocr] }
        fields: { type: array, items: { $ref: '#/components/schemas/EngineOptionFieldOut' } }
    EngineSettingsOut:
      type: object
      required: [engine, settings]
      properties:
        engine: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce, telegram, pyload, musicdl, ddddocr] }
        settings: { type: object, additionalProperties: true }
    CookieFileOut:
      type: object
      required: [filename, size_bytes]
      properties:
        filename: { type: string }
        size_bytes: { type: integer, minimum: 0 }
    CookieUploadedOut:
      type: object
      required: [filename, size_bytes, stored]
      properties:
        filename: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        stored: { type: boolean }
    CookieDeletedOut:
      type: object
      required: [deleted, filename]
      properties:
        deleted: { type: boolean }
        filename: { type: string }
    DeliveryTestOut:
      type: object
      required: [mode, verified, cleaned_up, message]
      properties:
        mode: { type: string, enum: [local, webdav] }
        verified: { type: boolean }
        cleaned_up: { type: boolean }
        message: { type: string }
    DeliverySettingsOut:
      type: object
      required: [mode, folder, password_configured]
      properties:
        mode: { type: string, enum: [local, webdav] }
        folder: { type: string }
        password_configured: { type: boolean }
        webdav_url: { type: [string, 'null'], default: null }
        username: { type: [string, 'null'], default: null }
    JobOut:
      type: object
      required: [id, url, engine, status, pause_capability, overrides, progress, output_files, log_text, error, cancel_requested, created_at, updated_at, finished_at]
      properties:
        id: { type: string }
        url: { type: string }
        owner_id: { type: [string, 'null'], default: null }
        delivery_subfolder: { type: [string, 'null'], default: null, description: One-off subfolder under the configured standalone destination. }
        engine: { type: string }
        status: { type: string, description: Includes paused aria2 jobs and nonterminal captcha-waiting pyLoad jobs. }
        pause_capability: { type: object, additionalProperties: true, description: 'Per-job can_pause boolean, can_resume boolean, and reason string or null.' }
        overrides: { type: object, additionalProperties: true }
        progress: { type: object, additionalProperties: true }
        output_files: { type: array, items: { type: object, additionalProperties: true } }
        log_text: { type: string }
        error: { type: [string, 'null'] }
        cancel_requested: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    JobBatchOut:
      type: object
      required: [created, jobs]
      properties:
        created: { type: integer }
        jobs: { type: array, items: { $ref: '#/components/schemas/JobOut' } }
    JobCreate:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 8, maxLength: 4096 }
        engine: { type: string, enum: [auto, yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce, telegram, pyload, musicdl], default: auto }
        preset_id: { type: [string, 'null'], maxLength: 36, default: null }
        overrides: { type: object, additionalProperties: true }
        delivery_subfolder: { type: [string, 'null'], maxLength: 100, default: null, description: Standalone jobs only; one safe folder name inside the administrator-configured delivery target. }
        owner_id: { type: [string, 'null'], minLength: 1, maxLength: 255, pattern: '^[^/\\\\\x00-\x1f]+$', default: null }
        delivery: { type: [object, 'null'], additionalProperties: true, default: null }
    JobBatchCreate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/JobCreate' }
    PresetInput:
      type: object
      required: [name, engine]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        engine: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce, telegram, pyload, musicdl, ddddocr] }
        settings: { type: object, additionalProperties: true }
        description: { type: string, maxLength: 1000, default: '' }
        is_shared: { type: boolean, default: false, description: Administrator opt-in; makes a safe preset available to entitled Nextcloud users. }
    EngineRuleOrderInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1001
          items: { type: string }
    EngineRuleOut:
      type: object
      required: [id, host_suffix, path_prefix, engine, priority, enabled, description]
      properties:
        id: { type: string, format: uuid }
        host_suffix: { type: string }
        path_prefix: { type: string }
        engine: { type: string }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        enabled: { type: boolean }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EngineRuleInput:
      type: object
      required: [host_suffix, engine]
      properties:
        host_suffix: { type: string, minLength: 3, maxLength: 255, description: Hostname suffix without scheme or wildcard. Matches the exact host and its subdomains. }
        path_prefix: { type: string, maxLength: 1024, default: / }
        engine: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce, telegram, pyload, musicdl, ddddocr] }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 100 }
        enabled: { type: boolean, default: true }
        description: { type: string, maxLength: 255, default: '' }
    EngineSettingsInput:
      type: object
      properties:
        settings: { type: object, additionalProperties: true }
    DeliverySettingsInput:
      type: object
      properties:
        mode: { type: string, enum: [local, webdav], default: local }
        webdav_url: { type: [string, 'null'], maxLength: 2048, default: null }
        username: { type: [string, 'null'], maxLength: 255, default: null }
        app_password: { type: [string, 'null'], maxLength: 1024, default: null, description: Write-only. Stored encrypted on the service. }
        folder: { type: string, maxLength: 512, default: Downloader }
