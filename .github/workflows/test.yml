name: Test

on:
  push:
    branches: [main, "phase-1/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ runner.temp }}/downloader-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
      - name: Validate OpenAPI YAML
        run: |
          python -m pip install PyYAML
          python -c "import yaml; spec=yaml.safe_load(open('openapi.yaml')); assert spec['openapi'].startswith('3.1'); print(f\"Validated {len(spec['paths'])} API paths\")"

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: downloader-server:test
