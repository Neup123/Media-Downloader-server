name: Test

on:
  push:
    branches: [main, "phase-1/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DIR: /tmp/downloader-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
      - name: Validate OpenAPI YAML
        run: |
          python -m pip install PyYAML
          python -c "import yaml; spec=yaml.safe_load(open('openapi.yaml')); assert spec['openapi'].startswith('3.1'); print(f\"Validated {len(spec['paths'])} API paths\")"

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: downloader-server:test
      - name: Smoke-test the actual disposable container and API boundary
        run: |
          python - <<'PY'
          import json
          import os
          import secrets
          import subprocess
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          name = "downloader-container-smoke"
          env = os.environ.copy()
          env["APP_API_TOKEN"] = secrets.token_urlsafe(48)
          base = "http://127.0.0.1:18080"
          try:
              subprocess.run(
                  ["docker", "run", "--detach", "--name", name,
                   "--publish", "127.0.0.1:18080:8080", "--env", "APP_API_TOKEN",
                   "downloader-server:test"],
                  check=True, env=env, stdout=subprocess.DEVNULL,
              )
              for attempt in range(90):
                  try:
                      with urlopen(base + "/healthz", timeout=3) as response:
                          assert response.status == 200
                          assert json.load(response)["status"] == "ok"
                      break
                  except (URLError, TimeoutError, ConnectionError):
                      time.sleep(1)
              else:
                  raise AssertionError("Disposable runtime did not pass /healthz")
              try:
                  urlopen(base + "/api/v1/engines", timeout=5)
              except HTTPError as error:
                  assert error.code == 401, "Unauthenticated engine inventory leaked"
              else:
                  raise AssertionError("Unauthenticated engine inventory was allowed")
              with urlopen(Request(base + "/api/v1/engines",
                                   headers={"X-API-Key": env["APP_API_TOKEN"]}),timeout=15) as response:
                  assert response.status == 200
                  inventory = json.load(response)
                  assert isinstance(inventory, list) and inventory
              print("Disposable image: healthy, anonymous access denied, authenticated engines listed.")
          finally:
              subprocess.run(["docker", "rm", "--force", name],
                             check=False, stdout=subprocess.DEVNULL,
                             stderr=subprocess.DEVNULL)
          PY
