name: Standalone prototype click review

on:
  pull_request:
    paths:
      - "prototypes/standalone-link-first.html"
      - "scripts/prototype_clicktest.py"
      - ".github/workflows/ux-prototype-clicktest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clickable-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install real-browser test dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Verify Chromium and execute mock UX journeys
        env:
          PROTOTYPE_SHOTS: prototype-evidence
        run: |
          google-chrome --version
          python scripts/prototype_clicktest.py
      - name: Keep owner-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-ux-prototype-screenshots
          path: prototype-evidence/*.png
          retention-days: 30
          if-no-files-found: warn
