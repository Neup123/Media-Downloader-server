name: Import reviewed UI evidence once

on:
  pull_request:
    types: [opened]
    paths:
      - ".github/workflows/import-reviewed-ui-evidence-once.yml"

permissions:
  contents: write
  actions: read

jobs:
  import:
    if: github.repository == 'Neup123/Media-Downloader-server' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/181-reviewed-ui-screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Import only the three independently reviewed screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/docs/181-reviewed-ui-screenshots | cut -f1)" = "$EXPECTED_HEAD"
          gh api repos/Neup123/Media-Downloader-server/actions/artifacts/14963491709/zip > "$RUNNER_TEMP/reviewed-ui.zip"
          python - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          expected = {
              "01-download-desktop.png": "7160c8168e3527d62428a2b2704ca0a6d2a6f5440ec3e46776f1a5e2b9524ed8",
              "02-library-desktop.png": "5702e059bc1f9fab8a00f6e2768037019b4ca50cc57c5135f88e9ca3764fa04e",
              "03-library-mobile.png": "2feb923d8696048beeec208de5ea0e31d41ed6f710bcdf867b23edc1a6a5fc2f",
          }
          target = Path("docs/screenshots")
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"]) / "reviewed-ui.zip") as archive:
              if set(archive.namelist()) != set(expected):
                  raise ValueError("Unexpected artifact members")
              for name, digest in expected.items():
                  info = archive.getinfo(name)
                  if not 0 < info.file_size < 1_000_000:
                      raise ValueError("Unexpected size")
                  data = archive.read(name)
                  if hashlib.sha256(data).hexdigest() != digest or not data.startswith(b"\x89PNG\r\n\x1a\n"):
                      raise ValueError("Screenshot differs from reviewed bytes")
                  (target / name).write_bytes(data)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/01-download-desktop.png docs/screenshots/02-library-desktop.png docs/screenshots/03-library-mobile.png
          git commit -m "Preserve exact reviewed running UI screenshots (#181)"
          git push origin HEAD:refs/heads/docs/181-reviewed-ui-screenshots
