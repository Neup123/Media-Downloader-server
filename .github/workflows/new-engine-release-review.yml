name: New engine release review (no promotion)

on:
  schedule:
    - cron: "29 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: new-engine-release-review
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'Neup123/Media-Downloader-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install packaging==25.0
      - name: Detect stable releases and deduplicate review issues
        run: python -m scripts.new_engine_release_review --report new-engine-release-review.json --record-reviews --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-engine-release-review
          path: new-engine-release-review.json
          if-no-files-found: error
          retention-days: 30
