services:
  nextcloud:
    image: nextcloud:35.0.2-apache
    restart: unless-stopped
    environment:
      SQLITE_DATABASE: nextcloud.db
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Set an ephemeral Nextcloud admin password}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1 nextcloud
      PHP_MEMORY_LIMIT: 512M
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - nextcloud-e2e-data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/status.php >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  media-source:
    image: python:3.13-slim
    command: ["python", "-m", "http.server", "9000", "--bind", "0.0.0.0", "--directory", "/fixtures"]
    volumes:
      - ./fixture:/fixtures:ro
    restart: unless-stopped

  downloader:
    build:
      context: .
      dockerfile: Dockerfile
    image: downloader-server:e2e
    restart: unless-stopped
    environment:
      APP_API_TOKEN: ${APP_API_TOKEN:?Set an ephemeral API token}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set an ephemeral Fernet key}
      DATA_DIR: /data
      OUTPUT_DIR: /data/downloads
      DATABASE_URL: sqlite:////data/downloader.db
      MAX_CONCURRENT_DOWNLOADS: 2
      MAX_CONCURRENT_YTDLP: 1
      MAX_CONCURRENT_ARIA2: 1
      ARIA2_RPC_PORT: 16800
      ALLOW_PRIVATE_TARGETS: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - downloader-e2e-data:/data
    depends_on:
      nextcloud:
        condition: service_started
      media-source:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  nextcloud-e2e-data:
  downloader-e2e-data:
